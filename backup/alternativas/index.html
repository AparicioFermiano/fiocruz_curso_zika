<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Questionário de Múltipla Escolha</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="bootstrap-icons.min.css">
  <link rel="stylesheet" href="bootstrap.min.css">
</head>
<body>

<div class="">
  <div class="pergunta" id="pergunta">
    <p>Qual é a capital do Brasil?</p>
    <div class="opcoes">
      <label><input type="radio" name="q1" value="a"> São Paulo</label>
      <label><input type="radio" name="q1" value="b"> Rio de Janeiro</label>
      <label><input type="radio" name="q1" value="c"> Brasília</label>
      <label><input type="radio" name="q1" value="d"> Belo Horizonte</label>
    </div>
    <div class="retorno">
      <p class="explicacao"></p>
    </div>
  </div>

  <button onclick="verificarResposta()">Verificar Resposta</button>
</div>

<div class="popup" id="popup">
    <div class="popup-content">
      <button type="button" class="btn-close bg-light rounded-circle p-3" onclick="fecharPopup()"></button>
      <div class="pop-text pt-3 text-justify">
      <p>Você já respondeu a pergunta!</p>
    </div>
    </div>
  </div>

  <div class="popup-overlay" id="popup-overlay"></div>


<script src="script.js"></script>
</body>
</html>
